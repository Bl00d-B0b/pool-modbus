name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  home-assistant:
    # The integration against Home Assistant 2026.9.4 and its Modbus integration's
    # pinned requirements. Home Assistant does not run on Windows.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: >
          pip install "pytest-homeassistant-custom-component==0.13.367"
          "modbus-connection[tmodbus]==4.10.0" "pymodbus==3.13.1" "tmodbus==0.6.2"
      - run: pytest tests_ha
