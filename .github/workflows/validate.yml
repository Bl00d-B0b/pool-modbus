name: Validate

# HACS's and Home Assistant's own checks of the integration: that HACS can install it
# from this repository, and that the manifest and strings meet hassfest's rules.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

jobs:
  hacs:
    runs-on: ubuntu-24.04
    steps:
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: home-assistant/actions/hassfest@master
